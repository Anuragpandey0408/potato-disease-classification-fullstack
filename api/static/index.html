<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Potato Disease Classifier</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; }
      .result { margin-top: 1rem; padding: 1rem; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <h1>Potato Disease Classifier</h1>
    <p>Upload a leaf image (jpg/png) to get a classification.</p>
    <input id="file" type="file" accept="image/*" />
    <button id="upload">Upload & Predict</button>
    <div id="status"></div>
    <div id="result" class="result" style="display:none;"></div>

    <script>
      document.getElementById("upload").addEventListener("click", async () => {
        const f = document.getElementById("file").files[0];
        if (!f) return alert("Select an image first");
        const form = new FormData();
        form.append("file", f);
        document.getElementById("status").innerText = "Uploading...";
        try {
          const res = await fetch("/predict", { method: "POST", body: form });
          const json = await res.json();
          if (!res.ok) {
            document.getElementById("status").innerText = "Error: " + (json.detail || res.statusText);
            return;
          }
          document.getElementById("status").innerText = "";
          document.getElementById("result").style.display = "block";
          document.getElementById("result").innerHTML = "<strong>Class:</strong> " + json.class +
            "<br/><strong>Confidence:</strong> " + (json.confidence*100).toFixed(2) + "%";
        } catch (e) {
          document.getElementById("status").innerText = "Request failed";
        }
      });
    </script>
  </body>
</html>
